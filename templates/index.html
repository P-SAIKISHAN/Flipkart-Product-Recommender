<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Chatbot - Priya Shopping Assistant</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css')}}"/>
</head>

<body>
    <div class="chat-main-container">
        <!-- Header -->
        <div class="chat-header">
            <!-- Left Section: Flipkart Branding -->
            <div class="header-left">
                <div class="flipkart-branding">
                    <span class="flipkart-text-logo">Flipkart</span>
                    <img src="{{ url_for('static', filename='flipkart_logo.png') }}" alt="Flipkart Logo" class="flipkart-logo-clean">
                </div>
            </div>

            <!-- Middle Section: Title -->
            <div class="header-middle">
                <span class="header-title">Smart Shopping Assistant</span>
            </div>

            <!-- Right Section: Agent Info with Image -->
            <div class="header-right">
                <div class="agent-info-section">
                    <div class="agent-details">
                        <span class="agent-name">Priya</span>
                        <span class="agent-subtitle">Online</span>
                    </div>
                    <div class="agent-avatar-container">
                        <!-- Professional Agent Image -->
                        <img src="{{ url_for('static', filename='priya_logo.png') }}" alt="Priya" class="agent-avatar-img">
                        <span class="online-status-indicator"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Container -->
        <div class="chat-wrapper">
            <div id="messageContainer" class="chat-messages">
                <!-- TODAY Section -->
                <div class="today-label">TODAY</div>

                <!-- Initial Bot Message -->
                <div class="message-group">
                    <div class="bot-avatar-msg">
                        <!-- Same Agent Image in messages -->
                        <img src="{{ url_for('static', filename='priya_logo.png') }}" alt="Priya" class="avatar-img">
                    </div>
                    <div class="message bot-message">
                        <p><strong>Namaste! I'm <span style="color: #1976d2;">Priya</span>, your Flipkart shopping assistant.</strong></p>
                        <p>Ask me about products, prices, deals or anything you want to shop for!</p>
                        <span class="message-time">Just now</span>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="chat-input-area">
                <form id="messageForm" class="message-input-form">
                    <div class="input-wrapper">
                        <div class="user-avatar-input">
                            <!-- Same Agent Image for input -->
                            <img src="{{ url_for('static', filename='priya_logo.png') }}" alt="Priya" class="avatar-img">
                        </div>
                        <input type="text" id="userInput" name="msg" class="message-input" placeholder="Ask Priya anything about Flipkart products..." required>
                        <button type="submit" class="send-button">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            let firstMessage = true;

            function scrollToBottom() {
                setTimeout(function() {
                    $("#messageContainer").scrollTop($("#messageContainer")[0].scrollHeight);
                }, 100);
            }

            function escapeHtml(text) {
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };
                return text.replace(/[&<>"']/g, m => map[m]);
            }

            $("#messageForm").on("submit", function(event) {
                event.preventDefault();
                
                const userInput = $("#userInput").val().trim();
                if (!userInput) return;

                const date = new Date();
                const timeString = date.toLocaleTimeString('en-US', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    hour12: true 
                });

                // Hide TODAY label on first real message
                if (firstMessage) {
                    $(".today-label").hide();
                    firstMessage = false;
                }

                // User Message
                const userMessageHTML = `
                    <div class="message-group user-group">
                        <div class="message user-message">
                            <p>${escapeHtml(userInput)}</p>
                            <span class="message-time">${timeString}</span>
                        </div>
                        <div class="user-avatar-chat">
                            <span class="user-initial">U</span>
                        </div>
                    </div>
                `;

                $("#messageContainer").append(userMessageHTML);
                $("#userInput").val("");
                scrollToBottom();

                // Loading indicator
                const loadingHTML = `
                    <div class="message-group">
                        <div class="bot-avatar-msg">
                            <img src="{{ url_for('static', filename='priya_logo.png') }}" alt="Priya" class="avatar-img">
                        </div>
                        <div class="message bot-message">
                            <div class="typing-indicator">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                        </div>
                    </div>
                `;

                $("#messageContainer").append(loadingHTML);
                scrollToBottom();

                // Send request
                $.ajax({
                    data: { msg: userInput },
                    type: "POST",
                    url: "/get",
                    timeout: 30000
                }).done(function(data) {
                    // Remove loading indicator
                    $("#messageContainer").find(".typing-indicator").closest(".message-group").remove();

                    // Bot Message
                    const botMessageHTML = `
                        <div class="message-group">
                            <div class="bot-avatar-msg">
                                <img src="{{ url_for('static', filename='priya_logo.png') }}" alt="Priya" class="avatar-img">
                            </div>
                            <div class="message bot-message">
                                <div class="bot-response">${data}</div>
                                <span class="message-time">${timeString}</span>
                            </div>
                        </div>
                    `;

                    $("#messageContainer").append(botMessageHTML);
                    scrollToBottom();
                }).fail(function() {
                    // Remove loading indicator
                    $("#messageContainer").find(".typing-indicator").closest(".message-group").remove();

                    const errorHTML = `
                        <div class="message-group">
                            <div class="bot-avatar-msg">
                                <img src="{{ url_for('static', filename='priya_logo.png') }}" alt="Priya" class="avatar-img">
                            </div>
                            <div class="message bot-message error">
                                <p><i class="fas fa-exclamation-circle"></i> Sorry, I couldn't process that. Please try again!</p>
                                <span class="message-time">${timeString}</span>
                            </div>
                        </div>
                    `;

                    $("#messageContainer").append(errorHTML);
                    scrollToBottom();
                });
            });
        });
    </script>
</body>
</html>
